<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Dedienɔ - Sécurité Togo</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/><style>body{font-family:Roboto,sans-serif}.video-bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}.video-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,28,56,0.75);z-index:-1}.sticky-cta{position:fixed;bottom:20px;right:20px;z-index:100;animation:pulse 2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@media(max-width:768px){.video-bg{display:none}}</style></head><body class="text-gray-800"><video id="bgVideo" class="video-bg" autoplay muted loop playsinline><source src="assets/video/bg.mp4" type="video/mp4"/></video><div class="video-overlay"></div><section class="min-h-screen flex items-center justify-center px-4 pt-20"><div class="max-w-4xl mx-auto text-center text-white" data-aos="fade-up"><h1 class="text-3xl md:text-5xl font-bold mb-4">Dedienɔ : Sécurité intelligente pour vos agents</h1><p class="text-lg mb-8 opacity-90">Pointage GPS • Alertes SOS • Rapports automatiques</p><a href="#commande" class="bg-green-500 hover:bg-green-600 text-white font-bold px-8 py-4 rounded-xl">📋 Commander</a></div></section><section id="demoVideo" class="py-12 bg-white"><div class="max-w-4xl mx-auto px-4 text-center"><h2 class="text-2xl font-bold mb-4">Démo en vidéo</h2><div class="relative pb-[56.25%] h-0 rounded-xl overflow-hidden shadow-xl"><iframe src="https://www.youtube.com/embed/FXZxIFB5clk?rel=0" frameborder="0" allowfullscreen class="absolute top-0 left-0 w-full h-full"></iframe></div></div></section><section id="commande" class="py-16"><div class="max-w-2xl mx-auto px-4"><form id="form" class="space-y-4 bg-gray-50 p-6 rounded-xl shadow"><input name="societe" placeholder="Société *" required class="w-full p-3 border rounded"/><input name="nom" placeholder="Nom *" required class="w-full p-3 border rounded"/><input name="prenom" placeholder="Prénom *" required class="w-full p-3 border rounded"/><input name="tel" placeholder="+228 90 12 34 56" required class="w-full p-3 border rounded"/><input name="email" type="email" placeholder="Email *" required class="w-full p-3 border rounded"/><select name="plan" required class="w-full p-3 border rounded"><option value="pro" selected>Pro (15 000 FCFA/mois)</option><option value="basique">Basique (5 000 FCFA/mois)</option><option value="entreprise">Entreprise (Sur devis)</option></select><button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-bold hover:bg-blue-700">✅ Valider ma commande</button></form><div id="msg" class="hidden p-4 rounded text-center mt-4"></div></div></section><a href="#commande" class="sticky-cta bg-green-500 text-white font-bold py-3 px-6 rounded-full shadow md:hidden">📋 Commander</a><footer class="bg-gray-900 text-white/80 py-6 text-center text-sm"><p>© 2026 Dedienɔ by CPEFPA • Lomé, Togo</p></footer><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script><script>AOS.init();document.getElementById("form").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),o=Object.fromEntries(d);document.getElementById("msg").textContent="✅ Commande reçue pour "+o.societe+" !";document.getElementById("msg").className="p-4 rounded bg-green-100 text-green-800 mt-4";e.target.reset()};</script></body></html>
